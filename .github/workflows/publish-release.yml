name: Sign the unpublished stock WonRemote Agent 120 bridge

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: wonremote-120-legacy-bridge-123-signature
  cancel-in-progress: false

jobs:
  sign-legacy-bridge:
    if: >-
      github.repository == 'hoguengine-stack/Wonremote'
      && github.repository_id == '1136941328'
      && github.ref == 'refs/heads/codex/sign-wonremote-lock-tolerant-120-123'
      && github.actor == 'hoguengine-stack'
      && github.actor_id == '246740147'
      && github.triggering_actor == 'hoguengine-stack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify legacy signature and draft boundaries
        run: node --experimental-strip-types --test aether-link-app/scripts/sign-120-legacy-manifest.test.js
      - name: Verify release change contract
        run: npm --prefix aether-link-app run change:verify:predeploy
      - name: Sign the exact bridge inside its unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY }}
        run: node --experimental-strip-types aether-link-app/scripts/sign-120-legacy-manifest.js
