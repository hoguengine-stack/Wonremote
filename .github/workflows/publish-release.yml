name: Sign approved WonRemote 0.1.124 compatibility private candidate draft

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: wonremote-compat124-8a21cfce-approved-private-draft
  cancel-in-progress: false

jobs:
  sign-approved-draft:
    if: >-
      github.repository == 'hoguengine-stack/Wonremote'
      && github.repository_id == '1136941328'
      && github.ref == 'refs/heads/codex/sign-wonremote-compat124-draft-8a21cfce'
      && github.actor == 'hoguengine-stack'
      && github.actor_id == '246740147'
      && github.triggering_actor == 'hoguengine-stack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify approved draft boundaries
        run: node --test aether-link-app/scripts/sign-compat124-draft-candidate.test.js
      - name: Verify active candidate qualification contract
        run: node aether-link-app/scripts/verify-recurrence-coverage.js --stage qualification
      - name: Sign the approved unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY }}
        run: node aether-link-app/scripts/sign-compat124-draft-candidate.js
