name: Publish WonRemote release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: aether-link-app
    env:
      GITHUB_TOKEN: ${{ github.token }}
      WONREMOTE_RELEASE_GATE_APPROVED: "YES"
      WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aether-link-app/package-lock.json

      - name: Restore Rust and downloaded tool caches
        uses: actions/cache@v4
        with:
          path: |
            aether-link-app/src-tauri/target
            aether-link-poc/target
            aether-link-app/.local-run/node-runtimes
            aether-link-app/.local-run/cmake
            aether-link-app/.local-run/nasm
          key: wonremote-windows-${{ runner.os }}-${{ hashFiles('aether-link-app/src-tauri/Cargo.lock', 'aether-link-poc/Cargo.lock', 'aether-link-app/package-lock.json') }}
          restore-keys: |
            wonremote-windows-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install x86 Rust target
        run: rustup target add i686-pc-windows-msvc

      - name: Verify release signing key
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY)) {
            throw "WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY GitHub Actions secret is missing."
          }

      - name: Verify version metadata is aligned
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $appVersion = (Select-String -Path src/domain/appVersion.ts -Pattern '"([0-9.]+)"').Matches[0].Groups[1].Value
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (@($appVersion, $cargoVersion, $tauriVersion) | Where-Object { $_ -ne $packageVersion }) {
            throw "Release version metadata must match package.json ($packageVersion)."
          }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Release tag must match package.json: expected v$packageVersion, got $env:GITHUB_REF_NAME."
          }

      - name: Verify update regression guards
        run: |
          npm test -- src/desktopPackaging.test.ts src/agent/productionUpdateCheck.test.ts src/agent/productionInstallerUpdate.test.ts src/agent/agentUpdateOnce.test.ts src/agent/productionUpdateMetadata.test.ts src/domain/updateManifest.test.ts src/domain/updateManifestScript.test.ts
          cargo test --manifest-path src-tauri/Cargo.toml test_node_resource_paths
          cargo test --manifest-path src-tauri/Cargo.toml test_update_handoff_acknowledgement_path_is_adjacent_to_the_owned_script

      - name: Build two universal installers and signed manifest
        run: |
          npm run release:exes
          npm run release:manifest

      - name: Publish GitHub release
        run: npm run release:publish
