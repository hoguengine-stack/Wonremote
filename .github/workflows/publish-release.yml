name: Publish WonRemote release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Prepare WonRemote v')
    runs-on: windows-2022
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
        working-directory: aether-link-app
    env:
      GITHUB_TOKEN: ${{ github.token }}
      WONREMOTE_RELEASE_GATE_APPROVED: "YES"
      WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY }}
      VITE_WONREMOTE_RTC_STUN_URLS: ${{ vars.WONREMOTE_RTC_STUN_URLS }}
      VITE_WONREMOTE_RTC_TURN_URLS: ${{ secrets.WONREMOTE_RTC_TURN_URLS }}
      VITE_WONREMOTE_RTC_TURN_USERNAME: ${{ secrets.WONREMOTE_RTC_TURN_USERNAME }}
      VITE_WONREMOTE_RTC_TURN_CREDENTIAL: ${{ secrets.WONREMOTE_RTC_TURN_CREDENTIAL }}
      VITE_WONREMOTE_RTC_RELAY_ONLY: ${{ vars.WONREMOTE_RTC_RELAY_ONLY }}
      VITE_WONREMOTE_RTC_CONNECT_TIMEOUT_MS: ${{ vars.WONREMOTE_RTC_CONNECT_TIMEOUT_MS }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The recurrence gate compares every commit after the previous published release tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aether-link-app/package-lock.json

      - name: Restore Rust and downloaded tool caches
        id: release-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            aether-link-app/src-tauri/target
            aether-link-poc/target
            aether-link-app/.local-run/node-runtimes
            aether-link-app/.local-run/cmake
            aether-link-app/.local-run/nasm
            aether-link-app/.local-run/7zip-verifier
          key: wonremote-windows-${{ runner.os }}-${{ hashFiles('aether-link-app/src-tauri/Cargo.lock', 'aether-link-poc/Cargo.lock', 'aether-link-app/package-lock.json') }}
          restore-keys: |
            wonremote-windows-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install x86 Rust target
        run: rustup target add i686-pc-windows-msvc

      - name: Verify release signing key
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY)) {
            throw "WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY GitHub Actions secret is missing."
          }

      - name: Verify realtime ICE configuration
        run: |
          $turnValues = @(
            $env:VITE_WONREMOTE_RTC_TURN_URLS,
            $env:VITE_WONREMOTE_RTC_TURN_USERNAME,
            $env:VITE_WONREMOTE_RTC_TURN_CREDENTIAL
          )
          $configuredTurnValues = @($turnValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($configuredTurnValues.Count -ne 0 -and $configuredTurnValues.Count -ne $turnValues.Count) {
            throw "TURN URL, username, and credential must be configured together."
          }
          if ($env:VITE_WONREMOTE_RTC_RELAY_ONLY -match '^(1|true|yes|on)$' -and $configuredTurnValues.Count -ne $turnValues.Count) {
            throw "Relay-only release requires a complete TURN configuration."
          }

      - name: Verify version metadata is aligned
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $appVersion = (Select-String -Path src/domain/appVersion.ts -Pattern '"([0-9.]+)"').Matches[0].Groups[1].Value
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if (@($appVersion, $cargoVersion, $tauriVersion) | Where-Object { $_ -ne $packageVersion }) {
            throw "Release version metadata must match package.json ($packageVersion)."
          }
          if ($env:GITHUB_REF_TYPE -ne "branch" -or $env:GITHUB_REF_NAME -ne "main") {
            throw "Release builds must run from main, got $env:GITHUB_REF_TYPE/$env:GITHUB_REF_NAME."
          }

      - name: Verify incident recurrence coverage
        run: npm run recurrence:verify

      - name: Verify release contract tests
        run: npm test -- src/desktopPackaging.test.ts src/agent/productionUpdateCheck.test.ts src/agent/productionInstallerUpdate.test.ts src/agent/agentUpdateOnce.test.ts src/agent/productionUpdateMetadata.test.ts src/domain/updateManifest.test.ts src/domain/updateManifestScript.test.ts

      - name: Verify installer update E2E
        run: npm run test:update-e2e

      - name: Build two x86 installers and signed compatibility manifest
        run: |
          npm run release:exes
          npm run release:manifest

      - name: Verify Tauri resource paths
        run: cargo test --manifest-path src-tauri/Cargo.toml --target i686-pc-windows-msvc --release --lib test_node_resource_paths

      - name: Verify updater acknowledgement ownership
        run: cargo test --manifest-path src-tauri/Cargo.toml --target i686-pc-windows-msvc --release --lib test_update_handoff_acknowledgement_path_is_adjacent_to_the_owned_script

      - name: Save Rust and downloaded tool caches
        if: always() && steps.release-cache.outputs.cache-hit != 'true' && hashFiles('aether-link-app/src-tauri/target/**', 'aether-link-poc/target/**') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            aether-link-app/src-tauri/target
            aether-link-poc/target
            aether-link-app/.local-run/node-runtimes
            aether-link-app/.local-run/cmake
            aether-link-app/.local-run/nasm
            aether-link-app/.local-run/7zip-verifier
          key: wonremote-windows-${{ runner.os }}-${{ hashFiles('aether-link-app/src-tauri/Cargo.lock', 'aether-link-poc/Cargo.lock', 'aether-link-app/package-lock.json') }}

      - name: Upload verified release files
        uses: actions/upload-artifact@v4
        with:
          name: wonremote-release-${{ github.sha }}
          path: aether-link-app/release-exe
          if-no-files-found: error
          retention-days: 3

  publish-release:
    needs: build-release
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
        working-directory: aether-link-app
    env:
      GITHUB_TOKEN: ${{ github.token }}
      WONREMOTE_RELEASE_GATE_APPROVED: "YES"
      WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.WONREMOTE_UPDATE_MANIFEST_PRIVATE_KEY }}
      WONREMOTE_SKIP_BUILD_PAYLOAD_PREFLIGHT: "YES"
      WONREMOTE_SKIP_UPDATE_E2E_PREFLIGHT: "YES"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download verified release files
        uses: actions/download-artifact@v4
        with:
          name: wonremote-release-${{ github.sha }}
          path: aether-link-app/release-exe

      - name: Publish GitHub release
        run: npm run release:publish

      - name: Verify live Firebase download aliases
        run: |
          $expectedAliases = @{
            "viewer" = "https://github.com/hoguengine-stack/Wonremote/releases/latest/download/WonRemote-Viewer-Setup.exe"
            "agent" = "https://github.com/hoguengine-stack/Wonremote/releases/latest/download/WonRemote-Agent-Setup.exe"
            "viewer-x86" = "https://github.com/hoguengine-stack/Wonremote/releases/latest/download/WonRemote-Viewer-Setup.exe"
            "agent-x86" = "https://github.com/hoguengine-stack/Wonremote/releases/latest/download/WonRemote-Agent-Setup.exe"
          }
          foreach ($alias in $expectedAliases.Keys) {
            $headers = & curl.exe --silent --show-error --head --max-redirs 0 "https://wonremote-a7fd3.web.app/download/$alias"
            if ($LASTEXITCODE -ne 0) {
              throw "Firebase alias request failed for $alias with exit code $LASTEXITCODE."
            }
            $statusLine = @($headers | Where-Object { $_ -match '^HTTP/' })[-1]
            $locationLine = $headers | Where-Object { $_ -match '^location:' } | Select-Object -First 1
            $location = ($locationLine -replace '^location:\s*', '').Trim()
            if ($statusLine -notmatch '\s302\s' -or $location -ne $expectedAliases[$alias]) {
              throw "Firebase alias mismatch for $alias. status=$statusLine location=$location"
            }
          }
