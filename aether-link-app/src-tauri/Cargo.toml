[package]
name = "aether-link-viewer"
version = "0.1.1"
description = "AetherLink Viewer desktop shell"
authors = ["AetherLink"]
edition = "2021"

[lib]
name = "aether_link_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security"
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
